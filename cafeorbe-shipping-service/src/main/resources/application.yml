spring:
  application:
    name: cafeorbe-shipping-service

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:cafeorbe_shipping}
    username: ${DB_USER:cafeorbe}
    password: ${DB_PASSWORD:cafeorbe}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:cafeorbe}
    password: ${RABBITMQ_PASSWORD:cafeorbe}

server:
  port: ${SERVER_PORT:8086}

management:
  endpoints:
    web:
      exposure:
        include: health,info
